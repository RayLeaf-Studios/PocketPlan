apply plugin: 'com.android.application'

android {
    namespace 'com.pocket_plan.j7_003'
    compileSdk = 37

    defaultConfig {
        applicationId "com.pocket_plan.j7_003"
        minSdk = 23
        targetSdk = 36

        versionCode 152
        versionName "1.5.2"


        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    bundle {
        language{
            enableSplit = false
        }
    }

    buildTypes {
        release {
            //always keep minifyEnabled false!
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    //Kotlin uses the same JVM target (built-in Kotlin, no kotlinOptions needed)
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
        //BuildConfig is used for the app id and version name in backups
        buildConfig = true
    }

    lint {
        disable.addAll(['ContentDescription', 'NotifyDataSetChanged', 'InflateParams'])
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.jakewharton.threetenabp:threetenabp:1.4.9'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
